name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # Runs with --coverage so the coverageThreshold gate in jest.config.js is
      # actually enforced; plain `npm test` collects no coverage and would skip it.
      - name: Run tests
        run: npm run test:coverage

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Error: Build failed - dist directory not found"
            exit 1
          fi
          echo "✅ Build completed successfully"
          ls -la dist/

      # The jest suite runs against src/, where neither `files` nor `exports` exists, so it
      # cannot catch a broken subpath map or a root barrel that drags in the optional AWS
      # peers — the two defects that shipped as 1.4.1. This packs the real tarball and
      # exercises it from a project with no AWS SDK installed.
      - name: Verify published package
        run: node scripts/verify-package.js
